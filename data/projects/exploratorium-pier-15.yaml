summary: >
  The Exploratorium at Pier 15, the science museum's 206,000-square-foot relocation
  to a rehabilitated pier on the San Francisco waterfront, opened in April 2013,
  with architecture by EHDD.
description: >
  EHDD's rehabilitation of the pier building is described by the firm as the largest
  net-zero-energy museum in the country; it received a 2014 AIA San Francisco
  Honor Award for Energy + Sustainability.
