summary: >-
  The Bank of America Stadium Experience Center ("MoMINTum"), a roughly 15,700-square-foot
  immersive preview and sales center for the stadium renovation, opened in Uptown
  Charlotte, North Carolina in July 2026, with creative direction, design and installation
  by Advent for Tepper Sports & Entertainment.
