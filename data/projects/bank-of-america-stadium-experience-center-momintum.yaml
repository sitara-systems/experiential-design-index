_comments: >-
  Editorial review: includes an adjacent sales office and is a preview/sales center
  for a stadium renovation (48-month lease), so it is semi-permanent and sales-oriented;
  treated as a built, public-facing experience center under the 'built physical space'
  line, not advertising. Opening: Axios 2026-07-24 says opened that week; sources
  differ on whether public opening has occurred.
