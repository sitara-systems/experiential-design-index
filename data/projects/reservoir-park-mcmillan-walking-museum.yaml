_comments: >-
  Belle & Wissell's page gives no explicit opening year for the interpretive work;
  2024 is the park opening per press named on that page (Washington Post, Axios DC,
  WJLA 2024). One B&W page names Envision McMillan as client, another the District;
  District used. Surfaced via CA 2026 Design shortlist (Environmental Graphics). Perkins
  Eastman DC (site master planning) omitted pending a firm-level check.
