summary: >
  The General Bradley and Zita Hosmer Visitor Center at the U.S. Air Force Academy
  in Colorado Springs, Colorado, a roughly 34,000-square-foot visitor center built
  around the Academy's 47-month cadet journey, opened to the public on May 16,
  2026, with exhibits and the tour experience designed by Gallagher & Associates.
