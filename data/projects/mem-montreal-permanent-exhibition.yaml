summary: >
  MONTRÉAL, the permanent exhibition of the MEM – Centre des mémoires
  montréalaises in Montréal, Québec, was inaugurated by the City of
  Montréal on September 28, 2023, with scenography, museography, multimedia
  and graphic design by GSM Project (now GSM Studios).
description: >
  The exhibition anchors the city's relaunched history museum, formerly the
  Centre d'histoire de Montréal, and presents the city through the memories
  of its residents. In 2025 the MEM received an Excellence award from the
  Société des musées du Québec and a Mason Multi-Media Award from the Oral
  History Association.
