summary: >
  "At the Top," Burj Khalifa's public observation-deck experience in
  Dubai, opened in January 2010 on the 124th–125th floors (with the SKY
  level added 2014 and The Lounge in 2019); SOM was architect of the
  tower, with augmented-reality telescopes on the 124th floor developed
  by Gsmprjct° of Montréal.
description: ""
_comments: >
  Credit sourced to Wikipedia, whose footnotes cite gsmprjct°'s own project page
  and a Journal de Montréal article of 4 January 2010 (link dead). GSM's
  own history timeline separately dates a 124th-floor observatory project to
  2014; the telescope attribution here stays dated to the 2010 opening
  pending a second independent source.
