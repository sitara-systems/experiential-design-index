summary: The Raclin Murphy Museum of Art, a 70,000-square-foot, Robert A.M. Stern-designed
  building with 23 galleries at the University of Notre Dame in South Bend, Indiana,
  opened to the public in December 2023, with exhibit design credited to Gallagher
  & Associates, fit-out by Kubik Maltbie and 90-plus bespoke showcases by Click
  Netherfield.
