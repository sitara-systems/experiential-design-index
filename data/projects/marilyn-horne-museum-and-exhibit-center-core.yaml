summary: The Marilyn Horne Museum and Exhibit Center, a museum on the life and career
  of the mezzo-soprano in the adaptively reused 1932 Seneca Building (now Marilyn
  Horne Hall) in Bradford, Pennsylvania, opened to the public on May 6, 2017, with
  exhibits designed by Steve Feldman Design.
