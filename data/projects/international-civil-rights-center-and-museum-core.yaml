summary: The International Civil Rights Center & Museum, in the former F.W. Woolworth
  building in Greensboro, North Carolina, opened on February 1, 2010, the 50th anniversary
  of the sit-ins; the building was designed by the Freelon Group and the exhibits
  by Eisterhold Associates, with Art Guild listing the museum in its portfolio.
