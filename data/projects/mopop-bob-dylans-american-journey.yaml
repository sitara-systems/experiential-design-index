summary: Bob Dylan's American Journey, 1956-1966, a 3,500-square-foot exhibition
  on the early years of Dylan's career organized by the Experience Music Project
  (now Museum of Pop Culture), opened in Seattle, Washington on November 20, 2004
  and ran through September 5, 2005, before touring; Curious Beast designed the
  exhibit.
