summary: >-
  "A Data Love Letter to the Subway," a data-driven animation spanning all 52 screens
  of the Fulton Center transit hub in New York City, was commissioned by MTA Arts
  & Design for the MTA's 40th anniversary and debuted in October 2025, designed by
  Pentagram.
