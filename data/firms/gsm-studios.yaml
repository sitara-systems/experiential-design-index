_comments: >
  Consolidated 2026-10-27 from two orphaned credit ids (gsm-project x2,
  gsmprjct x1). HQ taken from the studio address on gsmstudios.world
  (780 Brewster Ave, Montréal H4C 2K1); Design Montréal's directory lists
  Montréal-Ouest, likely a stale older address. A Dubai office is listed
  in the contact section with no address, so it is not recorded here.
  CONTINUITY FLAG: Wikipedia (citing a Deloitte insolvency listing) states
  the corporate entity GSMPRJCT Creation Inc. declared bankruptcy in
  September 2022; the brand was then reported joining the Humanise
  collective (Nov 2022) and relaunching as GSM Studios (March 2026). The
  index tracks the operating brand; credits dated before late 2022 were
  delivered by the predecessor entity. Not verified against the Deloitte
  listing directly. `fabrication` deliberately omitted from roles: firm
  markets itself as "design and production," but no current standalone
  fabrication offer was found. PORTFOLIO SCREEN 2026-10-27 (55 projects on gsmstudios.world plus the
  historical archive): 24 projects recorded, each with an independent
  source naming GSM; the rest held or excluded. Same firm treated as
  continuous across the 2022 entity change (editorial ruling). HELD
  (GSM's own pages are the only source for its role, or the year is
  unresolved; resurrect when an independent source is found): Vikings
  (Pointe-à-Callière 2022), Seeing Loud (MMFA, 2022 vs 2023), Treasures
  of the World from the British Museum (NMS 2015), Pompeii (NMS), Greek
  Masterpieces (NMS), Home Truly (NMS 2020), An Old New World (NMS 2019),
  Guo Pei / Faith Beauty Love Hope / Angkor (ACM), Indiana Jones (debut
  Montréal Science Centre 2011), Peary-MacMillan (Bowdoin 2023), Wyatt
  Earp Experience (Pella; no opening year found), Cast Iron and Faire du
  neuf and Mysterious Carnivores (Parc Marie-Victorin), Light: Visionary
  Perspectives (Aga Khan Museum 2024), Nanualuk and Humain (Montréal
  Science Centre; Humain 2015 vs 2017), Sam Centre (2024), Lest We Forget
  (Warehouse421 2015), Malay Heritage Centre, Reflections at Bukit
  Chandu, Gallop Extension, Borneo Cultures Museum, Temple de la
  renommée (Bell Centre 2009/2010), Le Carré des vestiges (2016/2017),
  Musée de l'ingéniosité, Cosmodome, Al Maktoum Residence (no pavilion
  opening date), Canada Pavilion Expo 2010, Cité du Vitrail (credit
  conflicts with another scenographer), McCord 2009, and the pre-2010
  archive (Montréal Science Centre iSci, Pointe-à-Callière shows, Musée
  de la civilisation, Strasbourg, Louis St-Laurent NHS, Expo 86, Expo 98
  Oceania, Espace Montréal). EXCLUDED: Qasr Al Hosn festival (event),
  du Dubai HQ (private interior), product/industrial design items. The
  ACM 'Ancestral Singapore' (2003) and National Museum of Singapore
  Living Galleries (2006) are real but unsourced; GSM's old
  gsmproject.com case studies are offline and the Wayback Machine was
  not reachable. Dpt. now has 3 credits (Bank of Canada Museum,
  Exploria, ArtLens Reimagined) and is a firm-record promotion candidate.
