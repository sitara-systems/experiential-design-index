status_basis: >
  Continuously operating under new management since late 2022 and
  rebranded from GSM Project to GSM Studios in March 2026; recent work
  includes the MEM – Centre des mémoires montréalaises permanent
  exhibition (opened September 2023; two 2025 awards, Société des musées
  du Québec and Oral History Association), the Parc Marie-Victorin
  "Mysterious Carnivores" garden (2024 per its own site), and the France
  Pavilion at Expo 2025 Osaka (per its own site).
status_verified: 2026-10-27
summary: >
  GSM Studios, formerly GSM Project, is a Montréal-headquartered
  exhibition design and production studio founded in 1958 as Jacques
  Guillon Designers, with additional studios in Paris and Singapore. It
  designs permanent exhibitions, visitor attractions and expo pavilions for
  museums and cultural institutions, spanning spatial and graphic design,
  storytelling and content, multimedia and interactive development.
