_comments: >
  Promoted in the 2026-11 discovery refresh after crossing 3 credited projects
  (University of Oregon Student Welcome Center, USC Heritage Hall, Bank of
  America Stadium Experience Center; plus an overlapping self-reported credit on
  the International Tennis Hall of Fame renovation). Founding year not found on
  the firm's site. The University of Texas Athletics Hall of Fame (2019) was held
  out: AP credits Advent with the design, BD+C credits Page with the design and
  Advent with storytelling content. Other stadium experience centers on Advent's
  site (Jaguars, Browns, Vegas A's, Inter Miami, Cowboys Ford Deck) need dated
  independent sources before adding.
